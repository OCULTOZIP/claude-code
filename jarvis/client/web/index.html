<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="JARVIS">
<meta name="theme-color" content="#0B0E0D">
<title>JARVIS</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230B0E0D'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%234FBFA5' stroke-width='2.5'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='%234FBFA5'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%230B0E0D'/%3E%3Ccircle cx='90' cy='90' r='42' fill='none' stroke='%234FBFA5' stroke-width='13'/%3E%3Ccircle cx='90' cy='90' r='15' fill='%234FBFA5'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Compatibilidade deliberada com Safari 13 (iOS 13):
   sem gap em flex, sem inset, sem :focus-visible sozinho, sem min(). */
:root{
  --bg:#0B0E0D; --panel:#121716; --raise:#182120; --line:#222D2A; --line-soft:#1A2321;
  --ink:#DFE6E2; --dim:#8C9A94; --faint:#5E6B66;
  --accent:#4FBFA5; --accent-dim:#153029;
  --r0:#5FBFA2; --r1:#A3C25E; --r2:#DBA33A; --r3:#E0704F;
  --bad:#E0704F; --good:#5FBFA2;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html{height:100%; height:-webkit-fill-available}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace; font-size:14px;
  display:flex; flex-direction:column;
  height:100vh; height:-webkit-fill-available; overflow:hidden;
}
.disp{font-family:"Bricolage Grotesque",system-ui,-apple-system,sans-serif; font-weight:700; letter-spacing:-.02em}
.lbl{font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--faint)}
button{font-family:inherit; font-size:inherit; cursor:pointer; border:0; background:none; color:inherit}
button:focus,input:focus{outline:2px solid var(--accent); outline-offset:2px}

/* ---------- conversa ---------- */
main{display:flex; flex-direction:column; min-width:0; min-height:0; flex:1}
header.bar{
  display:flex; align-items:center; padding:14px 16px; padding-top:calc(14px + var(--safe-t));
  border-bottom:1px solid var(--line); background:var(--panel); flex:none;
}
header.bar > * + *{margin-left:11px}
header.bar h1{font-size:18px; margin-top:0; margin-bottom:0}
.dot{width:7px; height:7px; border-radius:50%; background:var(--faint); flex:none}
.dot.on{background:var(--good); box-shadow:0 0 8px var(--good)}
.dot.busy{background:var(--r2); box-shadow:0 0 8px var(--r2)}
.bar .spacer{flex:1}
.bar .meta{font-size:10.5px; color:var(--faint); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:34vw}
.ghost{border:1px solid var(--line); padding:6px 10px; border-radius:2px; font-size:11px; color:var(--dim)}
.ghost:hover{border-color:var(--accent); color:var(--accent)}
.ghost[aria-pressed="true"]{border-color:var(--accent); color:var(--accent); background:var(--accent-dim)}

#log{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:18px 16px; min-height:0}
#log > * + *{margin-top:13px}
.msg{max-width:74ch}
.msg .who{margin-bottom:5px}
.msg.user .body{background:var(--raise); border-left:2px solid var(--dim); padding:9px 13px; border-radius:2px; white-space:pre-wrap}
.msg.jarvis .body{white-space:pre-wrap; line-height:1.6}
.msg.err .body{border-left:2px solid var(--bad); background:#1E1512; padding:9px 13px; color:#F0B6A5}
.msg.warn .body{border-left:2px solid var(--r2); background:#1C1811; padding:9px 13px; color:#E7CE95}
.msg.note .body{color:var(--dim); font-size:12.5px}
.msg.hint .body{border-left:2px solid var(--accent); background:var(--accent-dim); padding:9px 13px; color:var(--ink); font-size:12.5px; line-height:1.55}

.tool{border:1px solid var(--line-soft); background:var(--panel); border-radius:2px; padding:8px 12px; font-size:12px; max-width:74ch; display:flex; align-items:baseline}
.tool > * + *{margin-left:9px}
.tool .nm{color:var(--accent)}
.tool .st{margin-left:auto; color:var(--dim); font-size:11px}
.tool.ok{border-left:3px solid var(--good)}
.tool.fail{border-left:3px solid var(--bad)}
.tool.run{border-left:3px solid var(--r2)}
.tool .err{color:#F0B6A5}

footer.compose{
  border-top:1px solid var(--line); padding:12px 16px; background:var(--panel);
  padding-bottom:calc(12px + var(--safe-b)); display:flex; align-items:center; flex:none;
}
footer.compose > * + *{margin-left:10px}
#text{
  flex:1; min-width:0; background:var(--raise); border:1px solid var(--line); color:var(--ink);
  padding:12px; border-radius:2px; font-family:inherit;
  font-size:16px;  /* 16px impede o iOS de dar zoom ao focar o campo */
}
#mic{width:46px; height:46px; border-radius:50%; border:1px solid var(--line); background:var(--raise); flex:none; font-size:17px; line-height:1}
#mic.live{border-color:var(--bad); background:#2A1512; animation:pulse 1.1s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(224,112,79,.5)}50%{box-shadow:0 0 0 9px rgba(224,112,79,0)}}
#send{border:1px solid var(--accent); color:var(--accent); padding:12px 15px; border-radius:2px; flex:none}

/* ---------- painel ---------- */
aside{
  display:flex; flex-direction:column; background:var(--panel); overflow:hidden;
  position:fixed; top:0; right:0; bottom:0; width:340px; max-width:86vw; z-index:40;
  border-left:1px solid var(--line);
  padding-top:var(--safe-t); padding-bottom:var(--safe-b);
  -webkit-transform:translateX(101%); transform:translateX(101%);
  -webkit-transition:-webkit-transform .2s ease; transition:transform .2s ease;
}
body.panel aside{-webkit-transform:none; transform:none}
#scrim{position:fixed; top:0; right:0; bottom:0; left:0; background:rgba(4,7,6,.6); z-index:30; display:none}
body.panel #scrim{display:block}
.tabs{display:flex; border-bottom:1px solid var(--line); flex:none}
.tabs button{flex:1; padding:13px 3px; font-size:11px; color:var(--faint); letter-spacing:.06em}
.tabs button[aria-selected="true"]{color:var(--accent); box-shadow:inset 0 -2px 0 var(--accent)}
.pane{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:14px; display:none}
.pane.on{display:block}
.kv{display:flex; justify-content:space-between; padding:7px 0; border-bottom:1px solid var(--line-soft); font-size:12px}
.kv span:last-child{color:var(--dim); text-align:right; word-break:break-all; margin-left:10px}
.row{display:flex; align-items:center; padding:9px 0; border-bottom:1px solid var(--line-soft); font-size:12px}
.row > * + *{margin-left:9px}
.stripe{width:3px; align-self:stretch; border-radius:2px; flex:none}
.l0{background:var(--r0)}.l1{background:var(--r1)}.l2{background:var(--r2)}.l3{background:var(--r3)}
.row .nm{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis}
.row .lv{font-size:10px; color:var(--faint)}
.sw{width:40px; height:23px; border-radius:12px; background:#2B3733; position:relative; flex:none}
.sw::after{content:""; position:absolute; top:2px; left:2px; width:19px; height:19px; border-radius:50%; background:var(--faint); -webkit-transition:.15s; transition:.15s}
.sw[aria-checked="true"]{background:var(--accent-dim)}
.sw[aria-checked="true"]::after{left:19px; background:var(--accent)}
.entry{border-bottom:1px solid var(--line-soft); padding:9px 0; font-size:11.5px; word-break:break-word}
.entry .t{color:var(--faint); font-size:10px}
.entry .e{color:#F0B6A5}
.danger{border:1px solid var(--r3); color:var(--r3); padding:9px 12px; border-radius:2px; font-size:11px; margin-top:14px}

/* ---------- folha de confirmação ---------- */
#veil{
  position:fixed; top:0; right:0; bottom:0; left:0; background:rgba(4,7,6,.85);
  display:none; z-index:50; padding:16px; overflow-y:auto;
}
#veil.on{display:flex; align-items:center; justify-content:center}
.sheet{background:var(--panel); border:1px solid var(--line); border-radius:3px; max-width:560px; width:100%; overflow:hidden}
.sheet .bad{width:100%; height:5px}
.sheet .top{padding:14px 18px; border-bottom:1px solid var(--line); display:flex; align-items:center; flex-wrap:wrap}
.sheet .top > * + *{margin-left:10px}
.sheet .txt{padding:18px; white-space:pre-wrap; line-height:1.55; font-size:13.5px}
.sheet .why{padding:0 18px 14px; color:var(--r2); font-size:11.5px}
.sheet .acts{display:flex; padding:0 18px 18px; padding-bottom:calc(18px + var(--safe-b))}
.sheet .acts > * + *{margin-left:10px}
.sheet .acts button{flex:1; padding:15px 10px; border-radius:2px; font-size:13px}
.no{border:1px solid var(--line); color:var(--dim)}
.yes{border:1px solid var(--accent); color:var(--accent); background:var(--accent-dim)}
.yes.destructive{border-color:var(--r3); color:var(--r3); background:#241512}

/* ---------- telas largas: painel fixo ao lado ---------- */
@media (min-width:941px){
  body{display:-webkit-box; display:flex; flex-direction:row}
  main{border-right:1px solid var(--line)}
  aside{position:static; width:330px; max-width:none; -webkit-transform:none; transform:none; flex:none}
  #scrim{display:none !important}
  #painel{display:none}
  header.bar{padding-left:22px; padding-right:22px}
  #log{padding:22px}
  footer.compose{padding-left:22px; padding-right:22px}
  .bar .meta{max-width:none}
}
@media (prefers-reduced-motion:reduce){
  #mic.live{animation:none}
  aside{-webkit-transition:none; transition:none}
}
</style>
</head>
<body>

<main>
  <header class="bar">
    <span class="dot" id="dot"></span>
    <h1 class="disp">JARVIS</h1>
    <span class="spacer"></span>
    <span class="meta" id="meta"></span>
    <button class="ghost" id="voice" aria-pressed="true" title="Falar as respostas">voz</button>
    <button class="ghost" id="painel" aria-expanded="false">painel</button>
  </header>

  <div id="log"></div>

  <footer class="compose">
    <button id="mic" aria-label="Falar">&#127908;</button>
    <input id="text" placeholder="Fale ou escreva…" autocomplete="off" autocapitalize="sentences" enterkeyhint="send">
    <button id="send">enviar</button>
  </footer>
</main>

<div id="scrim"></div>

<aside>
  <div class="tabs" role="tablist">
    <button role="tab" aria-selected="true" data-p="status">status</button>
    <button role="tab" aria-selected="false" data-p="tools">ferramentas</button>
    <button role="tab" aria-selected="false" data-p="mem">memória</button>
    <button role="tab" aria-selected="false" data-p="log">logs</button>
  </div>
  <div class="pane on" id="p-status"></div>
  <div class="pane" id="p-tools"></div>
  <div class="pane" id="p-mem"></div>
  <div class="pane" id="p-log"></div>
</aside>

<div id="veil" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
  <div class="sheet">
    <div class="bad" id="sheet-stripe"></div>
    <div class="top"><span class="lbl" id="sheet-title">confirmação necessária</span><span class="lbl" id="sheet-tool"></span></div>
    <div class="txt" id="sheet-text"></div>
    <div class="why" id="sheet-why"></div>
    <div class="acts">
      <button class="no" id="sheet-no">CANCELAR</button>
      <button class="yes" id="sheet-yes">CONFIRMAR</button>
    </div>
  </div>
</div>

<script>
var $ = function(s){ return document.querySelector(s); };
var log = $('#log'), dot = $('#dot'), meta = $('#meta');
var LEVELS = ['sem risco','baixo','moderado','alto','bloqueado'];
var RISK = ['var(--r0)','var(--r1)','var(--r2)','var(--r3)','var(--r3)'];
var ws, speaking = true, pendingCall = null, currentBubble = null;

/* ---------- token de acesso ---------- */
var TOKEN = '';
try {
  var qs = new URLSearchParams(location.search);
  TOKEN = qs.get('k') || localStorage.getItem('jarvis_token') || '';
  if (qs.get('k')) {
    localStorage.setItem('jarvis_token', TOKEN);
    // tira o token da barra de endereço para não vazar em captura de tela
    history.replaceState(null, '', location.pathname);
  }
} catch (e) { TOKEN = ''; }
function withToken(path){ return path + (path.indexOf('?') < 0 ? '?' : '&') + 'k=' + encodeURIComponent(TOKEN); }

/* ---------- iOS ---------- */
var IS_IOS = /iP(hone|ad|od)/.test(navigator.userAgent) ||
             (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

/* ---------- conversa ---------- */
function add(cls, who, body){
  var d = document.createElement('div');
  d.className = 'msg ' + cls;
  var w = document.createElement('div'); w.className = 'who lbl'; w.textContent = who;
  var b = document.createElement('div'); b.className = 'body'; b.textContent = body;
  d.appendChild(w); d.appendChild(b);
  log.appendChild(d); log.scrollTop = log.scrollHeight;
  return b;
}
function toolCard(id, name){
  var d = document.createElement('div');
  d.className = 'tool run'; d.setAttribute('data-id', id);
  var n = document.createElement('span'); n.className = 'nm'; n.textContent = name;
  var s = document.createElement('span'); s.className = 'st'; s.textContent = 'executando…';
  d.appendChild(n); d.appendChild(s);
  log.appendChild(d); log.scrollTop = log.scrollHeight;
  return d;
}

/* ---------- voz ---------- */
var synth = window.speechSynthesis;
var ttsUnlocked = false;
function unlockTTS(){
  // O iOS só permite falar depois de um gesto do usuário. Este é o gesto.
  if (ttsUnlocked || !synth) return;
  try { synth.speak(new SpeechSynthesisUtterance(' ')); ttsUnlocked = true; } catch (e) {}
}
document.addEventListener('touchend', unlockTTS, {once:true});
document.addEventListener('click', unlockTTS, {once:true});

function speak(text){
  if (!speaking || !text || !synth) return;
  try {
    synth.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'pt-BR'; u.rate = 1.05;
    var vs = synth.getVoices() || [];
    for (var i = 0; i < vs.length; i++){
      if (vs[i].lang && vs[i].lang.toLowerCase().indexOf('pt') === 0){ u.voice = vs[i]; break; }
    }
    synth.speak(u);
  } catch (e) {}
}

var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
var rec = null, listening = false, hintShown = false;
if (SR){
  rec = new SR();
  rec.lang = 'pt-BR'; rec.interimResults = true; rec.continuous = false;
  rec.onresult = function(e){
    var t = '';
    for (var i = 0; i < e.results.length; i++) t += e.results[i][0].transcript;
    $('#text').value = t;
    if (e.results[e.results.length - 1].isFinal) send();
  };
  rec.onend = function(){ listening = false; $('#mic').classList.remove('live'); };
  rec.onerror = function(e){
    listening = false; $('#mic').classList.remove('live');
    add('warn','microfone','Reconhecimento de voz falhou: ' + e.error +
      (e.error === 'not-allowed' ? '. Autorize o microfone para este site.' : ''));
  };
}
$('#mic').onclick = function(){
  unlockTTS();
  if (synth) { try { synth.cancel(); } catch (e) {} }   // barge-in
  if (!SR){
    $('#text').focus();
    if (!hintShown){
      hintShown = true;
      add('hint','ditado', IS_IOS
        ? 'O Safari do iPhone não tem reconhecimento de voz, em versão nenhuma. Para falar, toque no campo de texto e use a tecla de microfone do teclado do iOS. O ditado é do sistema, funciona em português e não passa por este servidor.'
        : 'Este navegador não tem reconhecimento de voz. Use Chrome ou Edge, ou escreva o comando.');
    }
    return;
  }
  if (listening){ rec.stop(); return; }
  try { rec.start(); listening = true; $('#mic').classList.add('live'); } catch (e) {}
};
$('#voice').onclick = function(e){
  speaking = !speaking;
  e.currentTarget.setAttribute('aria-pressed', String(speaking));
  if (!speaking && synth) { try { synth.cancel(); } catch (err) {} }
};

/* ---------- painel deslizante ---------- */
function setPanel(open){
  document.body.classList.toggle('panel', open);
  $('#painel').setAttribute('aria-expanded', String(open));
  if (open) refresh();
}
$('#painel').onclick = function(){ setPanel(!document.body.classList.contains('panel')); };
$('#scrim').onclick = function(){ setPanel(false); };

/* ---------- canal ---------- */
function connect(){
  var proto = location.protocol === 'https:' ? 'wss://' : 'ws://';
  ws = new WebSocket(proto + location.host + withToken('/ws'));
  ws.onopen = function(){ dot.className = 'dot on'; };
  ws.onclose = function(ev){
    dot.className = 'dot';
    if (ev.code === 1008){
      meta.textContent = 'token inválido';
      add('err','acesso','Token ausente ou inválido. Abra novamente pelo endereço completo que o servidor imprimiu, incluindo a parte ?k=…');
      return;   // não reconecta em laço com token errado
    }
    meta.textContent = 'desconectado';
    setTimeout(connect, 2000);
  };
  ws.onmessage = function(ev){ handle(JSON.parse(ev.data)); };
}
function handle(m){
  if (m.type === 'ready'){
    meta.textContent = m.status.has_api_key ? m.status.model : 'SEM CHAVE DE API';
    if (!m.status.has_api_key)
      add('err','sistema','ANTHROPIC_API_KEY não está definida no ambiente do servidor. Exporte a chave e reinicie o servidor.');
    refresh();
  } else if (m.type === 'turn_start'){
    dot.className = 'dot busy'; currentBubble = null;
  } else if (m.type === 'delta'){
    if (!currentBubble) currentBubble = add('jarvis','JARVIS','');
    currentBubble.textContent += m.text; log.scrollTop = log.scrollHeight;
  } else if (m.type === 'tool_start'){
    toolCard(m.id, m.name); currentBubble = null;
  } else if (m.type === 'tool_end'){
    var card = log.querySelector('.tool[data-id="' + m.id + '"]') || toolCard(m.id, m.name);
    var ok = m.result && m.result.ok;
    card.className = 'tool ' + (ok ? 'ok' : 'fail');
    var st = card.querySelector('.st');
    st.textContent = ok ? 'ok' : (m.result.error_code || 'falhou');
    if (!ok){ st.className = 'st err'; st.title = m.result.error || ''; }
  } else if (m.type === 'confirm_request'){
    showSheet(m);
  } else if (m.type === 'warning'){
    add('warn','verificação', m.text);
  } else if (m.type === 'notice'){
    add('note','', m.text);
  } else if (m.type === 'reminder'){
    add('warn','lembrete', m.title + '  —  ' + m.when); speak('Lembrete: ' + m.title);
  } else if (m.type === 'error'){
    add('err','erro', m.text); dot.className = 'dot on';
  } else if (m.type === 'done'){
    dot.className = 'dot on';
    if (m.text) speak(m.text);
    var u = m.usage || {};
    meta.textContent = (m.tools.length ? m.tools.length + ' ferr · ' : '') +
      'cache ' + (u.cache_read || 0);
    currentBubble = null; refresh();
  }
}

/* ---------- confirmação ---------- */
function showSheet(m){
  pendingCall = m.call_id;
  $('#sheet-stripe').style.background = RISK[m.level] || RISK[3];
  $('#sheet-tool').textContent = m.tool + ' · nível ' + m.level + ' ' + (LEVELS[m.level] || '');
  $('#sheet-text').textContent = m.prompt;
  $('#sheet-why').textContent = (m.reasons && m.reasons.length)
    ? 'Elevado do nível ' + m.base_level + ': ' + m.reasons.join('; ') : '';
  var yes = $('#sheet-yes');
  yes.className = 'yes' + (m.level >= 3 ? ' destructive' : '');
  yes.textContent = m.level >= 3 ? 'CONFIRMAR MESMO ASSIM' : 'CONFIRMAR';
  $('#veil').classList.add('on');
  $('#sheet-no').focus();
}
function answer(ok){
  if (!pendingCall) return;
  ws.send(JSON.stringify({type:'confirmation_response', call_id: pendingCall, approved: ok}));
  pendingCall = null; $('#veil').classList.remove('on');
}
$('#sheet-yes').onclick = function(){ answer(true); };
$('#sheet-no').onclick = function(){ answer(false); };
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape' && pendingCall) answer(false);
});

/* ---------- envio ---------- */
function send(){
  var el = $('#text'), t = el.value.trim();
  if (!t || !ws || ws.readyState !== 1) return;
  add('user','você', t);
  ws.send(JSON.stringify({type:'user_message', text:t}));
  el.value = '';
}
$('#send').onclick = send;
$('#text').addEventListener('keydown', function(e){ if (e.key === 'Enter') send(); });

/* ---------- painel de dados ---------- */
var tabs = document.querySelectorAll('.tabs button');
for (var i = 0; i < tabs.length; i++){
  tabs[i].onclick = function(e){
    var b = e.currentTarget;
    for (var j = 0; j < tabs.length; j++) tabs[j].setAttribute('aria-selected','false');
    var panes = document.querySelectorAll('.pane');
    for (var k = 0; k < panes.length; k++) panes[k].classList.remove('on');
    b.setAttribute('aria-selected','true');
    $('#p-' + b.getAttribute('data-p')).classList.add('on');
    refresh();
  };
}
function get(path){
  return fetch(withToken('/api/' + path)).then(function(r){
    if (r.status === 401) throw new Error('token');
    return r.json();
  }).catch(function(){ return null; });
}
function refresh(){
  Promise.all([get('status'), get('tools'), get('memory'), get('audit?limit=60')])
    .then(function(res){
      var st = res[0], tools = res[1], mem = res[2], aud = res[3];
      if (st) $('#p-status').innerHTML =
        kv('modelo', st.model) + kv('esforço', st.effort) +
        kv('chave de API', st.has_api_key ? 'presente' : 'AUSENTE') +
        kv('área concedida', st.workspace) +
        kv('escuta', st.host + (st.host_is_public ? ' (rede local)' : ' (só esta máquina)')) +
        kv('busca web', st.web_search ? 'ligada' : 'desligada') +
        kv('modo restrito', st.restricted ? 'ATIVO' : 'desligado') +
        kv('ferramentas', st.tools_enabled + ' de ' + st.tools_total) +
        kv('memórias', st.memories) + kv('lembretes pendentes', st.reminders_pending);

      if (tools){
        var html = '';
        for (var i = 0; i < tools.length; i++){
          var t = tools[i];
          html += '<div class="row"><div class="stripe l' + t.risk_level + '"></div>' +
            '<div class="nm">' + esc(t.name) + '<div class="lv">nível ' + t.risk_level +
            (t.requires_confirmation ? ' · confirma' : '') + '</div></div>' +
            '<div class="sw" role="switch" tabindex="0" aria-checked="' + t.enabled +
            '" data-t="' + esc(t.name) + '"></div></div>';
        }
        $('#p-tools').innerHTML = html || '<p class="lbl">nenhuma</p>';
        var sws = document.querySelectorAll('.sw');
        for (var s = 0; s < sws.length; s++){
          sws[s].onclick = function(e){
            fetch(withToken('/api/tools/' + encodeURIComponent(e.currentTarget.getAttribute('data-t')) + '/toggle'),
                  {method:'POST'}).then(refresh);
          };
        }
      }

      if (mem){
        var mh = '';
        for (var n = 0; n < mem.length; n++){
          mh += '<div class="entry"><div class="t">' + esc(mem[n].layer) + ' · ' +
            esc(mem[n].created_at) + '</div><b>' + esc(mem[n].key) + '</b><br>' +
            esc(mem[n].content) + '</div>';
        }
        $('#p-mem').innerHTML = mh || '<p class="lbl">memória vazia</p>';
      }

      if (aud){
        var ah = '';
        for (var a = 0; a < aud.length; a++){
          var x = aud[a];
          ah += '<div class="entry"><div class="t">' + esc(x.ts) + ' · ' + esc(x.kind) +
            (x.risk_level != null ? ' · nível ' + x.risk_level + (x.escalated ? ' (elevado)' : '') : '') +
            (x.confirmed && x.confirmed !== 'n/a' ? ' · ' + esc(x.confirmed) : '') + '</div><b>' +
            esc(x.tool || '') + '</b> ' + (x.duration_ms != null ? x.duration_ms + 'ms' : '') +
            (x.error ? '<div class="e">' + esc(x.error) + '</div>' : '') +
            (x.params ? '<div class="t">' + esc(String(x.params).slice(0, 160)) + '</div>' : '') +
            '</div>';
        }
        $('#p-log').innerHTML = ah + '<button class="danger" id="purge">apagar histórico e logs</button>';
        var pb = $('#purge');
        if (pb) pb.onclick = function(){
          if (!confirm('Apagar todo o histórico de conversas e a trilha de auditoria?')) return;
          fetch(withToken('/api/purge/tudo'), {method:'POST'}).then(refresh);
        };
      }
    });
}
function kv(k, v){ return '<div class="kv"><span>' + esc(k) + '</span><span>' + esc(String(v)) + '</span></div>'; }
function esc(s){
  return String(s).replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
  });
}

connect();
if (synth && synth.getVoices) synth.getVoices();
</script>
</body>
</html>
