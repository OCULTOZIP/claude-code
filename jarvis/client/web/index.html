<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JARVIS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#0B0E0D; --panel:#121716; --raise:#182120; --line:#222D2A; --line-soft:#1A2321;
  --ink:#DFE6E2; --dim:#8C9A94; --faint:#5E6B66;
  --accent:#4FBFA5; --accent-dim:#153029;
  --r0:#5FBFA2; --r1:#A3C25E; --r2:#DBA33A; --r3:#E0704F;
  --bad:#E0704F; --good:#5FBFA2;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace; font-size:14px;
  display:grid; grid-template-columns:minmax(0,1fr) 330px; height:100vh; overflow:hidden;
}
.disp{font-family:"Bricolage Grotesque",system-ui,sans-serif; font-weight:700; letter-spacing:-.02em}
.lbl{font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--faint)}
button{font-family:inherit; font-size:inherit; cursor:pointer; border:0; background:none; color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

/* ---------- coluna da conversa ---------- */
main{display:flex; flex-direction:column; min-width:0; border-right:1px solid var(--line)}
header.bar{
  display:flex; align-items:center; gap:14px; padding:14px 22px;
  border-bottom:1px solid var(--line); background:var(--panel);
}
header.bar h1{font-size:19px; margin:0}
.dot{width:7px; height:7px; border-radius:50%; background:var(--faint); flex:none}
.dot.on{background:var(--good); box-shadow:0 0 8px var(--good)}
.dot.busy{background:var(--r2); box-shadow:0 0 8px var(--r2)}
.bar .spacer{flex:1}
.bar .meta{font-size:11px; color:var(--faint)}
.ghost{
  border:1px solid var(--line); padding:5px 11px; border-radius:2px;
  font-size:11px; color:var(--dim);
}
.ghost:hover{border-color:var(--accent); color:var(--accent)}
.ghost[aria-pressed="true"]{border-color:var(--accent); color:var(--accent); background:var(--accent-dim)}

#log{flex:1; overflow-y:auto; padding:22px; display:flex; flex-direction:column; gap:14px}
.msg{max-width:74ch}
.msg .who{margin-bottom:5px}
.msg.user .body{
  background:var(--raise); border-left:2px solid var(--dim);
  padding:9px 13px; border-radius:2px; white-space:pre-wrap;
}
.msg.jarvis .body{white-space:pre-wrap; line-height:1.6}
.msg.err .body{
  border-left:2px solid var(--bad); background:#1E1512; padding:9px 13px; color:#F0B6A5;
}
.msg.warn .body{
  border-left:2px solid var(--r2); background:#1C1811; padding:9px 13px; color:#E7CE95;
}
.msg.note .body{color:var(--dim); font-size:12.5px}

.tool{
  border:1px solid var(--line-soft); background:var(--panel); border-radius:2px;
  padding:8px 12px; font-size:12px; max-width:74ch; display:flex; gap:10px; align-items:baseline;
}
.tool .nm{color:var(--accent)}
.tool .st{margin-left:auto; color:var(--dim); font-size:11px}
.tool.ok{border-left:3px solid var(--good)}
.tool.fail{border-left:3px solid var(--bad)}
.tool.run{border-left:3px solid var(--r2)}
.tool .err{color:#F0B6A5}

footer.compose{
  border-top:1px solid var(--line); padding:14px 22px; background:var(--panel);
  display:flex; gap:11px; align-items:center;
}
#text{
  flex:1; background:var(--raise); border:1px solid var(--line); color:var(--ink);
  padding:11px 13px; border-radius:2px; font-family:inherit; font-size:14px;
}
#mic{
  width:46px; height:46px; border-radius:50%; border:1px solid var(--line);
  background:var(--raise); display:grid; place-items:center; flex:none; font-size:17px;
}
#mic.live{border-color:var(--bad); background:#2A1512; animation:pulse 1.1s infinite}
#mic:disabled{opacity:.35; cursor:not-allowed}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(224,112,79,.5)}50%{box-shadow:0 0 0 9px rgba(224,112,79,0)}}
@media (prefers-reduced-motion:reduce){#mic.live{animation:none}}
#send{border:1px solid var(--accent); color:var(--accent); padding:11px 18px; border-radius:2px}

/* ---------- painel ---------- */
aside{display:flex; flex-direction:column; background:var(--panel); min-width:0; overflow:hidden}
.tabs{display:flex; border-bottom:1px solid var(--line)}
.tabs button{flex:1; padding:11px 4px; font-size:11px; color:var(--faint); letter-spacing:.08em}
.tabs button[aria-selected="true"]{color:var(--accent); box-shadow:inset 0 -2px 0 var(--accent)}
.pane{flex:1; overflow-y:auto; padding:16px; display:none}
.pane.on{display:block}
.kv{display:flex; justify-content:space-between; gap:10px; padding:6px 0; border-bottom:1px solid var(--line-soft); font-size:12px}
.kv span:last-child{color:var(--dim); text-align:right; word-break:break-all}
.row{
  display:flex; align-items:center; gap:9px; padding:8px 0;
  border-bottom:1px solid var(--line-soft); font-size:12px;
}
.stripe{width:3px; align-self:stretch; border-radius:2px; flex:none}
.l0{background:var(--r0)}.l1{background:var(--r1)}.l2{background:var(--r2)}.l3{background:var(--r3)}
.row .nm{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis}
.row .lv{font-size:10px; color:var(--faint)}
.sw{width:34px; height:19px; border-radius:10px; background:#2B3733; position:relative; flex:none}
.sw::after{content:""; position:absolute; top:2px; left:2px; width:15px; height:15px; border-radius:50%; background:var(--faint); transition:.15s}
.sw[aria-checked="true"]{background:var(--accent-dim)}
.sw[aria-checked="true"]::after{left:17px; background:var(--accent)}
.entry{border-bottom:1px solid var(--line-soft); padding:9px 0; font-size:11.5px}
.entry .t{color:var(--faint); font-size:10px}
.entry .e{color:#F0B6A5}
.danger{border:1px solid var(--r3); color:var(--r3); padding:7px 11px; border-radius:2px; font-size:11px; margin-top:14px}

/* ---------- folha de confirmacao ---------- */
#veil{
  position:fixed; inset:0; background:rgba(4,7,6,.82); display:none;
  place-items:center; padding:22px; z-index:50;
}
#veil.on{display:grid}
.sheet{
  background:var(--panel); border:1px solid var(--line); border-radius:3px;
  max-width:560px; width:100%; overflow:hidden;
}
.sheet .top{padding:15px 20px; border-bottom:1px solid var(--line); display:flex; gap:11px; align-items:center}
.sheet .bad{width:100%; height:5px}
.sheet .txt{padding:20px; white-space:pre-wrap; line-height:1.55; font-size:13.5px}
.sheet .why{padding:0 20px 16px; color:var(--r2); font-size:11.5px}
.sheet .acts{display:flex; gap:11px; padding:0 20px 20px}
.sheet .acts button{flex:1; padding:13px; border-radius:2px; font-size:13px}
.no{border:1px solid var(--line); color:var(--dim)}
.no:hover{border-color:var(--ink); color:var(--ink)}
.yes{border:1px solid var(--accent); color:var(--accent); background:var(--accent-dim)}
.yes.destructive{border-color:var(--r3); color:var(--r3); background:#241512}
@media(max-width:940px){
  body{grid-template-columns:1fr; grid-template-rows:1fr auto}
  aside{max-height:36vh; border-top:1px solid var(--line)}
  main{border-right:0}
}
</style>
</head>
<body>

<main>
  <header class="bar">
    <span class="dot" id="dot"></span>
    <h1 class="disp">JARVIS</h1>
    <span class="spacer"></span>
    <span class="meta" id="meta"></span>
    <button class="ghost" id="voice" aria-pressed="true" title="Falar as respostas">voz</button>
    <button class="ghost" id="reset" title="Limpar o contexto da conversa">reiniciar</button>
  </header>

  <div id="log"></div>

  <footer class="compose">
    <button id="mic" title="Falar (segure para gravar)" aria-label="Falar">&#127908;</button>
    <input id="text" placeholder="Fale ou escreva um comando…" autocomplete="off">
    <button id="send">enviar</button>
  </footer>
</main>

<aside>
  <div class="tabs" role="tablist">
    <button role="tab" aria-selected="true" data-p="status">status</button>
    <button role="tab" aria-selected="false" data-p="tools">ferramentas</button>
    <button role="tab" aria-selected="false" data-p="mem">memória</button>
    <button role="tab" aria-selected="false" data-p="log">logs</button>
  </div>
  <div class="pane on" id="p-status"></div>
  <div class="pane" id="p-tools"></div>
  <div class="pane" id="p-mem"></div>
  <div class="pane" id="p-log"></div>
</aside>

<div id="veil" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
  <div class="sheet">
    <div class="bad" id="sheet-stripe"></div>
    <div class="top"><span class="lbl" id="sheet-title">confirmação necessária</span><span class="lbl" id="sheet-tool"></span></div>
    <div class="txt" id="sheet-text"></div>
    <div class="why" id="sheet-why"></div>
    <div class="acts">
      <button class="no" id="sheet-no">CANCELAR</button>
      <button class="yes" id="sheet-yes">CONFIRMAR</button>
    </div>
  </div>
</div>

<script>
const $ = (s) => document.querySelector(s);
const log = $('#log'), dot = $('#dot'), meta = $('#meta');
const LEVELS = ['sem risco','baixo','moderado','alto','bloqueado'];
const RISK = ['var(--r0)','var(--r1)','var(--r2)','var(--r3)','var(--r3)'];
let ws, speaking = true, pendingCall = null, currentBubble = null;

// ---------------------------------------------------------------- conversa
function add(cls, who, body){
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.innerHTML = '<div class="who lbl"></div><div class="body"></div>';
  d.querySelector('.who').textContent = who;
  d.querySelector('.body').textContent = body;
  log.appendChild(d); log.scrollTop = log.scrollHeight;
  return d.querySelector('.body');
}
function toolCard(id, name){
  const d = document.createElement('div');
  d.className = 'tool run'; d.dataset.id = id;
  d.innerHTML = '<span class="nm"></span><span class="st">executando…</span>';
  d.querySelector('.nm').textContent = name;
  log.appendChild(d); log.scrollTop = log.scrollHeight;
  return d;
}

// ---------------------------------------------------------------- voz
const synth = window.speechSynthesis;
function speak(text){
  if (!speaking || !text || !synth) return;
  synth.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'pt-BR'; u.rate = 1.05;
  const v = synth.getVoices().find(v => v.lang && v.lang.toLowerCase().startsWith('pt'));
  if (v) u.voice = v;
  synth.speak(u);
}
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, listening = false;
if (SR){
  rec = new SR();
  rec.lang = 'pt-BR'; rec.interimResults = true; rec.continuous = false;
  rec.onresult = (e) => {
    let t = '';
    for (const r of e.results) t += r[0].transcript;
    $('#text').value = t;
    if (e.results[e.results.length-1].isFinal){ send(); }
  };
  rec.onend = () => { listening = false; $('#mic').classList.remove('live'); };
  rec.onerror = (e) => {
    listening = false; $('#mic').classList.remove('live');
    add('warn','microfone','Reconhecimento de voz falhou: ' + e.error +
      (e.error === 'not-allowed' ? '. Autorize o microfone para este site.' : ''));
  };
} else {
  $('#mic').disabled = true;
  $('#mic').title = 'Este navegador não tem reconhecimento de voz. Use Chrome ou Edge.';
}
$('#mic').onclick = () => {
  if (!rec) return;
  if (synth) synth.cancel();          // barge-in: falar interrompe a resposta
  if (listening){ rec.stop(); return; }
  try { rec.start(); listening = true; $('#mic').classList.add('live'); }
  catch(_){ /* já iniciado */ }
};
$('#voice').onclick = (e) => {
  speaking = !speaking;
  e.target.setAttribute('aria-pressed', String(speaking));
  if (!speaking && synth) synth.cancel();
};

// ---------------------------------------------------------------- canal
function connect(){
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
  ws.onopen = () => { dot.className = 'dot on'; };
  ws.onclose = () => { dot.className = 'dot'; meta.textContent = 'desconectado'; setTimeout(connect, 2000); };
  ws.onmessage = (ev) => handle(JSON.parse(ev.data));
}
function handle(m){
  switch(m.type){
    case 'ready':
      meta.textContent = m.status.model + (m.status.has_api_key ? '' : ' · SEM CHAVE DE API');
      if (!m.status.has_api_key)
        add('err','sistema','ANTHROPIC_API_KEY não está definida no ambiente do servidor. Exporte a chave e reinicie.');
      refresh(); break;
    case 'turn_start': dot.className = 'dot busy'; currentBubble = null; break;
    case 'delta':
      if (!currentBubble) currentBubble = add('jarvis','JARVIS','');
      currentBubble.textContent += m.text; log.scrollTop = log.scrollHeight; break;
    case 'tool_start': toolCard(m.id, m.name); currentBubble = null; break;
    case 'tool_end': {
      const card = log.querySelector('.tool[data-id="'+m.id+'"]') || toolCard(m.id, m.name);
      const ok = m.result && m.result.ok;
      card.className = 'tool ' + (ok ? 'ok' : 'fail');
      const st = card.querySelector('.st');
      st.textContent = ok ? 'ok' : (m.result.error_code || 'falhou');
      if (!ok){ st.classList.add('err'); st.title = m.result.error || ''; }
      break;
    }
    case 'confirm_request': showSheet(m); break;
    case 'warning': add('warn','verificação', m.text); break;
    case 'notice': add('note','', m.text); break;
    case 'reminder': {
      add('warn','lembrete', m.title + '  —  ' + m.when);
      speak('Lembrete: ' + m.title); break;
    }
    case 'error': add('err','erro', m.text); dot.className = 'dot on'; break;
    case 'done': {
      dot.className = 'dot on';
      if (m.text) speak(m.text);
      const u = m.usage || {};
      meta.textContent = (m.tools.length ? m.tools.length + ' ferramenta(s) · ' : '') +
        'cache ' + (u.cache_read || 0) + ' · saída ' + (u.output || 0);
      currentBubble = null; refresh(); break;
    }
  }
}

// ---------------------------------------------------------------- confirmação
function showSheet(m){
  pendingCall = m.call_id;
  $('#sheet-stripe').style.background = RISK[m.level] || RISK[3];
  $('#sheet-tool').textContent = m.tool + ' · nível ' + m.level + ' ' + (LEVELS[m.level]||'');
  $('#sheet-text').textContent = m.prompt;
  $('#sheet-why').textContent = (m.reasons && m.reasons.length)
    ? 'Elevado do nível ' + m.base_level + ': ' + m.reasons.join('; ') : '';
  const yes = $('#sheet-yes');
  yes.className = 'yes' + (m.level >= 3 ? ' destructive' : '');
  yes.textContent = m.level >= 3 ? 'CONFIRMAR MESMO ASSIM' : 'CONFIRMAR';
  $('#veil').classList.add('on');
  $('#sheet-no').focus();
}
function answer(ok){
  if (!pendingCall) return;
  ws.send(JSON.stringify({type:'confirmation_response', call_id: pendingCall, approved: ok}));
  pendingCall = null; $('#veil').classList.remove('on');
}
$('#sheet-yes').onclick = () => answer(true);
$('#sheet-no').onclick = () => answer(false);
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && pendingCall) answer(false);
});

// ---------------------------------------------------------------- envio
function send(){
  const el = $('#text'), t = el.value.trim();
  if (!t || !ws || ws.readyState !== 1) return;
  add('user','você', t);
  ws.send(JSON.stringify({type:'user_message', text:t}));
  el.value = '';
}
$('#send').onclick = send;
$('#text').addEventListener('keydown', (e) => { if (e.key === 'Enter') send(); });
$('#reset').onclick = () => { ws.send(JSON.stringify({type:'reset'})); log.innerHTML = ''; };

// ---------------------------------------------------------------- painel
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.tabs button').forEach(x => x.setAttribute('aria-selected','false'));
  document.querySelectorAll('.pane').forEach(x => x.classList.remove('on'));
  b.setAttribute('aria-selected','true');
  $('#p-' + b.dataset.p).classList.add('on');
  refresh();
});
async function refresh(){
  const [st, tools, mem, aud] = await Promise.all(
    ['status','tools','memory','audit?limit=60'].map(u => fetch('/api/'+u).then(r=>r.json()).catch(()=>null))
  );
  if (st) $('#p-status').innerHTML =
    kv('modelo', st.model) + kv('esforço', st.effort) + kv('chave de API', st.has_api_key ? 'presente' : 'AUSENTE') +
    kv('área concedida', st.workspace) + kv('busca web', st.web_search ? 'ligada' : 'desligada') +
    kv('modo restrito', st.restricted ? 'ATIVO' : 'desligado') +
    kv('ferramentas', st.tools_enabled + ' de ' + st.tools_total) +
    kv('memórias', st.memories) + kv('lembretes pendentes', st.reminders_pending);

  if (tools) $('#p-tools').innerHTML = tools.map(t =>
    '<div class="row"><div class="stripe l'+t.risk_level+'"></div>' +
    '<div class="nm">'+esc(t.name)+'<div class="lv">nível '+t.risk_level+
    (t.requires_confirmation?' · confirma':'')+'</div></div>' +
    '<div class="sw" role="switch" tabindex="0" aria-checked="'+t.enabled+'" data-t="'+esc(t.name)+'"></div></div>'
  ).join('') || '<p class="lbl">nenhuma</p>';
  document.querySelectorAll('.sw').forEach(s => {
    const go = async () => {
      await fetch('/api/tools/'+encodeURIComponent(s.dataset.t)+'/toggle', {method:'POST'});
      refresh();
    };
    s.onclick = go;
    s.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } };
  });

  if (mem) $('#p-mem').innerHTML = (mem.map(m =>
    '<div class="entry"><div class="t">'+esc(m.layer)+' · '+esc(m.created_at)+'</div>' +
    '<b>'+esc(m.key)+'</b><br>'+esc(m.content)+'</div>').join('')
    || '<p class="lbl">memória vazia</p>');

  if (aud) $('#p-log').innerHTML = aud.map(a =>
    '<div class="entry"><div class="t">'+esc(a.ts)+' · '+esc(a.kind)+
    (a.risk_level!=null?' · nível '+a.risk_level+(a.escalated?' (elevado)':''):'')+
    (a.confirmed && a.confirmed!=='n/a'?' · '+esc(a.confirmed):'')+'</div>' +
    '<b>'+esc(a.tool||'')+'</b> '+(a.duration_ms!=null?a.duration_ms+'ms':'') +
    (a.error?'<div class="e">'+esc(a.error)+'</div>':'') +
    (a.params?'<div class="t">'+esc(String(a.params).slice(0,160))+'</div>':'')+'</div>'
  ).join('') + '<button class="danger" onclick="purge()">apagar histórico e logs</button>';
}
async function purge(){
  if (!confirm('Apagar todo o histórico de conversas e a trilha de auditoria?')) return;
  await fetch('/api/purge/tudo', {method:'POST'}); refresh();
}
function kv(k, v){ return '<div class="kv"><span>'+esc(k)+'</span><span>'+esc(String(v))+'</span></div>'; }
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

connect();
if (synth) synth.getVoices();
$('#text').focus();
</script>
</body>
</html>
