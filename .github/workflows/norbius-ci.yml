name: NORBIUS CI

on:
  pull_request:
    paths: ["norbius/**", ".github/workflows/norbius-ci.yml"]
  push:
    branches: [main]
    paths: ["norbius/**", ".github/workflows/norbius-ci.yml"]

permissions:
  contents: read

concurrency:
  group: norbius-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: norbius

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://norbius_app:norbius_app@localhost:5432/norbius
      DATABASE_MIGRATION_URL: postgres://norbius_owner:norbius_owner@localhost:5432/norbius
      POSTGRES_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: norbius/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: norbius/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile

      - name: Banco (papéis + migrações)
        run: |
          bash infra/db/setup-local.sh
          pnpm db:migrate

      - name: Typecheck
        run: pnpm typecheck

      - name: Testes (unitários, integração e isolamento RLS)
        run: pnpm test

      - name: Build do web (API_URL é fixado no build pelos rewrites)
        run: pnpm --filter @norbius/web build
        env:
          API_URL: http://localhost:4100

      - name: E2E
        run: |
          pnpm --filter @norbius/web exec playwright install --with-deps chromium
          pnpm test:e2e
        env:
          CI: "true"

      - name: Contexto das falhas do E2E
        if: failure()
        run: |
          find apps/web/test-results -name error-context.md -print0 2>/dev/null \
            | xargs -0 -r -I{} sh -c 'echo "::group::{}"; cat "{}"; echo "::endgroup::"'

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: norbius/apps/web/test-results
          retention-days: 7
